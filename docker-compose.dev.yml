services:
  news_scraper:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: news_scraper_dev
    volumes:
      # Bind mount host directory (including .venv)
      - .:/app
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-localhost}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-news_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - CRAWL_INTERVAL_HOURS=6
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BATCH_SIZE=${BATCH_SIZE:-10}
      - MAX_RPM=${MAX_RPM:-12}
      - CRON_WORKERS=${CRON_WORKERS-enrich}
      - WORKER_CRON_ENRICH=${WORKER_CRON_ENRICH:-*/1 * * * *}
      - RUN_ENRICH_WORKER_AFTER_CRAWL=${RUN_ENRICH_WORKER_AFTER_CRAWL:-false}
    stdin_open: true
    tty: true
    networks:
      - databases-network

networks:
  databases-network:
    external: true
